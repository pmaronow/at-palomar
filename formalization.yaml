  notes: Automated inspection of the physical model, concrete expectations, closed targets, proof routes,
    and scope disclosures. Local supported-toolchain builds, transitive axiom audits, numbered proof checks,
    and Comparator verification with Lean, NanoDa, and con-ron passed. The verification scope and reproduction
    commands are recorded in README.md and results.json. This is agent review; prior human mathematical
    peer review is not established, and Palomar review has not occurred.
