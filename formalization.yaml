fidelity:
  divergences: Theorem 1.1 is expressed as convergence of the expected finite free energy, which includes
    existence of the limit. The overlap fixed point is an explicit universally quantified q; the boundary
    uses an existential fixed point. The smooth function is represented on all real beta, with positivity,
    smoothness and strict monotonicity restricted to beta > 1. The selected main proof uses a vendored
    strict-AT theorem, a proved physical normalization bridge, and boundary approximation. The project's
    separately formalized PDE/variational route follows the paper but is not the selected Solution proof.
    General process results use a canonical Brownian realization with its natural filtration. No formal
    transport to a completed right-continuous augmented filtration is asserted. HJB controls are bounded
    continuous adapted controls of magnitude at most one. General time derivatives are weak; classical
    Dirac time regularity excludes the interface q. Historical survey claims, including zero-field phases
    and replica symmetry breaking above the AT line, are cited background and are not selected registry
    claims.
review:
